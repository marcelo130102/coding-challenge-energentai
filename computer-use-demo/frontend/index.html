<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Computer Use — Demo</title>
    <style>
      :root {
        --bg: #f4f4f5;
        --surface: #fff;
        --border: #e4e4e7;
        --text: #18181b;
        --muted: #71717a;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        min-height: 100vh;
      }
      header {
        padding: 1rem 1.25rem;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
      }
      header p {
        margin: 0.35rem 0 0;
        font-size: 0.875rem;
        color: var(--muted);
      }
      main {
        padding: 1rem 1.25rem 2rem;
        max-width: 1200px;
        margin: 0 auto;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 1rem;
      }
      button {
        cursor: pointer;
        font: inherit;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      #session-label {
        font-size: 0.875rem;
        color: var(--muted);
      }
      .cred-panel {
        width: 100%;
        margin-bottom: 0.75rem;
        padding: 0.75rem 1rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        display: grid;
        gap: 0.5rem;
        grid-template-columns: 1fr 1fr;
      }
      @media (max-width: 700px) {
        .cred-panel {
          grid-template-columns: 1fr;
        }
      }
      .cred-panel label {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--muted);
      }
      .cred-panel input,
      .cred-panel select {
        font: inherit;
        padding: 0.45rem 0.5rem;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        align-items: stretch;
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 420px;
      }
      .panel h2 {
        margin: 0;
        padding: 0.65rem 1rem;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        background: #fafafa;
      }
      #chat-log {
        flex: 1;
        overflow-y: auto;
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
        max-height: 320px;
      }
      .msg {
        margin-bottom: 0.65rem;
        padding: 0.45rem 0.65rem;
        border-radius: 6px;
        background: #f4f4f5;
      }
      .msg.user {
        border-left: 3px solid var(--accent);
      }
      .msg.assistant {
        border-left: 3px solid #16a34a;
      }
      .msg.progress {
        border-left: 3px solid #ca8a04;
        font-style: italic;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .msg .role {
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.2rem;
      }
      .chat-input {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        border-top: 1px solid var(--border);
        background: #fafafa;
      }
      .chat-input input {
        flex: 1;
        padding: 0.5rem 0.65rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
      }
      .vnc-wrap {
        flex: 1;
        min-height: 360px;
        background: #18181b;
        position: relative;
      }
      #vnc-frame {
        width: 100%;
        height: 100%;
        min-height: 360px;
        border: 0;
        display: block;
      }
      #vnc-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #a1a1aa;
        font-size: 0.9rem;
        padding: 1rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Computer Use — API demo</h1>
      <p>
        Crea una sesión, chatea por WebSocket y abre el escritorio noVNC cuando haya puerto
        asignado.
      </p>
    </header>
    <main>
      <div class="cred-panel">
        <label>
          Anthropic API key
          <input
            type="password"
            id="api-key"
            placeholder="sk-ant-…"
            autocomplete="off"
          />
        </label>
        <label>
          API endpoint
          <select id="api-endpoint">
            <option value="global">Global (api.anthropic.com)</option>
            <option value="packyapi">PackyAPI (www.packyapi.com)</option>
          </select>
        </label>
        <label style="grid-column: 1 / -1">
          Custom base URL (optional, https only; overrides endpoint above)
          <input
            type="url"
            id="base-url-override"
            placeholder="https://…"
            autocomplete="off"
          />
        </label>
      </div>
      <div class="toolbar">
        <button type="button" class="primary" id="btn-new">Create New Session</button>
        <span id="session-label">No session</span>
      </div>
      <div class="layout">
        <section class="panel" aria-label="Chat">
          <h2>Chat</h2>
          <div id="chat-log" role="log" aria-live="polite"></div>
          <form class="chat-input" id="chat-form">
            <input
              type="text"
              id="chat-input"
              placeholder="Write a message…"
              autocomplete="off"
              disabled
            />
            <button type="submit" id="btn-send" disabled>Send</button>
          </form>
        </section>
        <section class="panel" aria-label="noVNC">
          <h2>Desktop (noVNC)</h2>
          <div class="vnc-wrap">
            <div id="vnc-placeholder">
              Create a session with VNC (Docker orchestration) or assign vnc_port to see the
              desktop here.
            </div>
            <iframe
              id="vnc-frame"
              title="noVNC"
              hidden
              sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals"
            ></iframe>
          </div>
        </section>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
